title = "archtrace gitleaks policy"

[extend]
useDefault = true

[allowlist]
description = """
Paths and patterns that are not secrets. Everything listed here is either a
fixture, a hash, or a deliberate example -- none of it is a credential.
"""
paths = [
  # Worked-example transcripts are invented; the people in them do not exist.
  '''example/_evidence_root/.*''',
  # Generated build outputs are derived from committed sources.
  '''example/render/.*''',
]
regexes = [
  # Evidence integrity hashes and content-addressed ids are SHA-256 digests, not
  # keys. Without this, every evidence record reads as a leaked secret.
  '''"sha256_normalized":\s*"[a-f0-9]{64}"''',
  '''sha256:[a-f0-9]{64}''',
  '''sym:[a-f0-9]{16}''',
  '''"commit":\s*"[a-f0-9]{7,40}"''',
  # Example hosts, never resolvable.
  '''https?://[^\s"']*\.(example|invalid)(\.[a-z]+)?''',
]

[[rules]]
id = "evidence-content-in-git"
description = """
Recording content must never be committed. A repository cannot satisfy a
retention obligation, and deleting a file does not delete the blob -- it stays
reachable by SHA in every clone, fork and CI cache. The repository holds claims
about evidence; the content stays in the system of record.
"""
regex = '''(?im)^\s*\d{2}:\d{2}:\d{2}\s+[A-Z]\.\s+\w+:'''
# (?m) is required: RE2, like every standard regex engine, anchors ^
# to the start of the whole scanned content without it -- so without
# (?m) this rule can only ever match a transcript's literal first byte,
# which no real transcript is (they all have a header line before the
# first turn). Confirmed by building the pinned gitleaks binary and
# running it: the rule missed this repo's own committed example
# fixture entirely before this fix.
# Go's regex engine (RE2) has no lookahead, and gitleaks panics rather than
# warning when a config asks for one -- it produces no report at all, so the
# rule silently stops running AND the job fails on the missing artifact. The
# exclusion for the worked example therefore belongs in an allowlist, which is
# the supported way to say "everywhere except here".
path = '''\.(json|md|txt)$'''

  [[rules.allowlists]]
  description = "Worked-example transcripts are invented; they are fixtures."
  paths = ['''^example/''']
