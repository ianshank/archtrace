name: ci

# Two jobs on purpose. `gate` proves the zero-dependency invariant by installing
# nothing at all -- if it ever needs a setup step, that is a regression, not a
# convenience. `quality` is allowed its dev tooling.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (no dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prove nothing is installed
        run: |
          pip list --format=freeze > /tmp/before.txt
          echo "--- packages present before the gate runs ---"
          cat /tmp/before.txt
      - run: make agents
      # Needs nothing installed, so it belongs here rather than in the
      # quality job. Until now the only enforcement that recording
      # content stays out of git was a local pre-commit hook.
      - run: make evidence-guard
      - run: make test
      # `check` BEFORE `gate`, and it is not redundant. `gate` is
      # `fmt render check`, so it regenerates every artifact before checking
      # it: a hand-edited render is silently overwritten and `gate` goes green.
      # Running the gate against the bytes as committed is the only step here
      # that can actually fail on a tampered deliverable.
      - name: Gate the committed bytes, without regenerating them
        run: make check
      # And do it for every engagement in the repo, not just ROOT.
      - name: Every engagement's renders match the current renderer
        run: make freshness
      - run: make gate
      - name: Coverage floors
        # One version only: the tracer's line attribution differs slightly
        # between releases, so a matrix would compare unlike numbers.
        if: matrix.python-version == '3.11'
        run: make coverage
      - name: Fail if the gate pulled in a dependency
        run: |
          pip list --format=freeze > /tmp/after.txt
          diff /tmp/before.txt /tmp/after.txt || {
            echo "::error::the gate installed something; the zero-dependency invariant is broken"
            exit 1
          }

  quality:
    name: lint, types, secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action enumerates the PR's commits through the API on a
      # pull_request event, so the scan needs to read the PR itself. Scoped to
      # this job rather than widened at the workflow level.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks scans history, not just the tip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # `make lint` and `make types` degrade to a printed SKIP and exit 0 when
      # the tool is absent -- correct for a gate that must run with nothing
      # installed, and a trap here: if the console scripts land off PATH, this
      # job goes green having linted nothing. Assert they exist FIRST, so the
      # failure is "ruff is missing" rather than a silent pass.
      - name: The dev tooling is actually on PATH
        run: ruff --version && mypy --version
      - run: make lint
      - run: make types
      - uses: gitleaks/gitleaks-action@v2
        env:
          # Pinned. The action defaults to whatever gitleaks version it ships
          # with, while .pre-commit-config.yaml pins v8.21.2 -- so CI and the
          # commit hook scanned with different binaries against a config whose
          # `(?im)` fix and `[[rules.allowlists]]` block were verified against
          # one of them.
          GITLEAKS_VERSION: "8.21.2"
          # Required since v2 for pull_request scans; without it the action
          # stops before scanning anything. This was previously masked: the
          # config panicked on an unsupported regex before the token was read.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  container:
    name: image builds and the CLI runs in it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t archtrace:ci .
      - run: docker run --rm archtrace:ci --help
