# The gate runs before the commit, not after the review. A finding you see at
# commit time costs seconds; the same finding in a stakeholder deck costs a
# meeting.
#
# Ordered cheapest-first. Only the hooks that need no third-party package are
# unconditional; the rest are additional_dependencies so a fresh clone still
# gets a useful pre-commit without a manual install step.

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: '^example/render/'
      - id: trailing-whitespace
        exclude: '^example/(render|_evidence_root)/'
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
        stages: [manual]      # formatting is not enforced; lint is

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^tools/archtrace/
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml", "--redact"]

  - repo: local
    hooks:
      - id: evidence-content-not-committed
        name: evidence content must not enter git
        language: system
        pass_filenames: false
        entry: >-
          bash -c 'if git diff --cached --name-only | grep -q "_evidence_root/";
          then echo "Recording content cannot be committed: a repository cannot
          satisfy a retention obligation, and deleting a file does not delete
          the blob."; exit 1; fi'

      - id: archtrace-agents
        name: agent definitions validate
        language: system
        pass_filenames: false
        files: '^\.github/agents/.*\.agent\.md$'
        entry: ./archtrace agents

      - id: archtrace-gate
        name: archtrace gate
        language: system
        pass_filenames: false
        files: '^(engagements/.*/)?(model|requirements|evidence)/.*\.json$'
        entry: bash -c 'make gate ROOT="${ARCHTRACE_ROOT:-example}"'
