# The gate runs before the commit, not after the review. A finding you see at
# commit time costs seconds; the same finding in a stakeholder deck costs a
# meeting.
#
# Ordered cheapest-first. Only the hooks that need no third-party package are
# unconditional; the rest are additional_dependencies so a fresh clone still
# gets a useful pre-commit without a manual install step.

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: '^example/render/'
      - id: trailing-whitespace
        exclude: '^example/(render|_evidence_root)/'
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Kept in the same minor line as pyproject.toml's `dev` extra
    # (ruff>=0.15,<0.16) -- otherwise a clean commit hook can be followed by a
    # failing CI quality job, or the reverse, on the identical tree.
    rev: v0.15.22
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
        stages: [manual]      # formatting is not enforced; lint is

  - repo: https://github.com/pre-commit/mirrors-mypy
    # Kept in the same minor line as pyproject.toml's `dev` extra
    # (mypy>=1.19,<1.20), for the same reason as the ruff pin above.
    rev: v1.19.1
    hooks:
      - id: mypy
        files: ^tools/archtrace/
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml", "--redact"]

  - repo: local
    hooks:
      - id: evidence-content-not-committed
        name: evidence content must not enter git
        language: system
        pass_filenames: false
        entry: >-
          bash -c 'if git diff --cached --name-only | grep -q "_evidence_root/";
          then echo "Recording content cannot be committed: a repository cannot
          satisfy a retention obligation, and deleting a file does not delete
          the blob."; exit 1; fi'

      - id: archtrace-agents
        name: agent definitions validate
        language: system
        pass_filenames: false
        files: '^\.github/agents/.*\.agent\.md$'
        entry: ./archtrace agents

      - id: archtrace-freshness
        name: archtrace render freshness (every engagement)
        language: system
        pass_filenames: false
        # Also fires on render/, which the gate hook below never did: editing a
        # build output was the one change that triggered nothing at all.
        files: '^(engagements/.*/|example/)?(model|requirements|evidence|render)/'
        # `make gate` is `fmt render check`: it regenerates every artifact
        # before checking it, so a hand-edited render is overwritten rather
        # than reported and the hook passes. `freshness` asks G6 of every
        # engagement DISCOVERED in the repo, without writing to the tree --
        # so it does not depend on ARCHTRACE_ROOT pointing at the engagement
        # that actually changed.
        entry: make freshness

      - id: archtrace-check
        name: archtrace check (the bytes as committed)
        language: system
        pass_filenames: false
        files: '^(engagements/.*/)?(model|requirements|evidence)/.*\.json$'
        # `check`, not `gate`. `make gate` is `fmt render check`: it WRITES to
        # the working tree during a commit and regenerates every artifact
        # before checking it, so a hand edit is overwritten rather than
        # reported -- the exact failure `freshness` above and the CI ordering
        # were added to close, left live in the commit hook.
        entry: bash -c 'make check ROOT="${ARCHTRACE_ROOT:-example}"'
